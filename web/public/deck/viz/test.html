<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck viz test</title>
<style>
  @font-face { font-family: "Inter Tight"; src: url("../fonts/inter-tight-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  :root { --scene: #f6f6fb; --line: #dcdcea; --ink: #1d1a78; --muted: #5d5b94; --accent: #3c36da; --west: #3c36da; --east: #9d2f7f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--scene); color: var(--ink); font-family: "Inter Tight", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  section { width: 1920px; height: 1080px; padding: 100px 140px; display: flex; flex-direction: column; gap: 30px; border-bottom: 2px dashed var(--line); }
  h2 { font-size: 64px; font-weight: 700; letter-spacing: -0.02em; }
  .viz { flex: 1 1 auto; min-height: 0; }
  button { position: fixed; right: 20px; top: 20px; font: inherit; font-size: 20px; padding: 8px 16px; }
</style>
</head>
<body>
<button id="replay">replay all</button>
<section><h2>8 years of flown directions</h2><div class="viz" data-mod="barcode"></div></section>
<section><h2>How often we are right</h2><div class="viz" data-mod="accuracy"></div></section>
<section><h2>Inside the model</h2><div class="viz" data-mod="tree"></div></section>
<section><h2>What matters most</h2><div class="viz" data-mod="drivers"></div></section>
<section><h2>One real day</h2><div class="viz" data-mod="example"></div></section>
<section><h2>How it works</h2><div class="viz" data-mod="pipeline"></div></section>
<script type="module">
  const mounted = [];
  for (const el of document.querySelectorAll("[data-mod]")) {
    try {
      const mod = await import(`./${el.dataset.mod}.js`);
      mounted.push(mod.mount(el));
    } catch (e) {
      el.closest("section").remove();
      console.warn("skip", el.dataset.mod, e.message);
    }
  }
  document.getElementById("replay").onclick = () => mounted.forEach((m) => m.replay());
  window.__vizReady = true;
</script>
</body>
</html>
